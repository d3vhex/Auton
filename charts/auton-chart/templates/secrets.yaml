{{- if and .Values.agent.auth.create (not .Values.agent.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auton.tokenSecretName" . }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
  annotations:
    # A regenerated token would break n8n and the ops controller; keep it on
    # uninstall unless the operator deletes it explicitly.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ include "auton.apiToken" . | quote }}
{{- end }}
{{- if not .Values.provider.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auton.modelSecretName" . }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.provider.apiKey | quote }}
{{- end }}
{{- if and .Values.queue.redisAuth .Values.queue.redisSecret.create (not .Values.queue.redisExistingSecret) (eq .Values.queue.backend "redis") }}
---
# The queue password (Phase 5). The clients read it from a mounted file and
# the Redis server writes it into its config; it is never a literal in a
# manifest and never an environment variable.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auton.redisSecretName" . }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
  annotations:
    # A regenerated password would lock every client out, so the Secret
    # survives an uninstall.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ include "auton.redisPassword" . | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.provider.configMapName }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
data:
  provider: {{ .Values.provider.name | quote }}
  base_url: {{ .Values.provider.baseUrl | quote }}
  model: {{ .Values.provider.model | quote }}
  max_tokens: {{ .Values.provider.maxTokens | quote }}
  data_policy: {{ .Values.provider.dataPolicy | quote }}
