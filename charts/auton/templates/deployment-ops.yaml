{{- if .Values.ops.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auton-ops
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
    app: auton-ops
    auton.io/protect: "true"
spec:
  replicas: {{ .Values.ops.replicas }}
  strategy:
    type: Recreate          # RWO volume: never run two pods at once
  selector:
    matchLabels:
      app: auton-ops
  template:
    metadata:
      labels:
        {{- include "auton.labels" . | nindent 8 }}
        app: auton-ops
        auton.io/protect: "true"
    spec:
      # The LLM executor keeps the broad `auton-agent` identity: the agent loop
      # needs both namespaces and the read-only cluster view for its tools.
      # Repair playbooks are *not* here — the workers own them.
      serviceAccountName: {{ .Values.serviceAccount.agent.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-workspace-owner
          image: {{ include "auton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 10001:10001 /workspace && chmod 0770 /workspace"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: ops
          image: {{ include "auton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "agent_worker.py"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- $env := dict
            "HOME" "/tmp"
            "TMPDIR" "/tmp"
            "PYTHONDONTWRITEBYTECODE" "1"
            "AGENT_WORKSPACE" "/workspace"
            "AGENT_AUDIT_DIR" "/workspace/.ops"
            "AGENT_INCIDENTS_DIR" "/workspace/.ops/incidents"
            "AGENT_MODEL" .Values.agent.model
            "AGENT_MODEL_DIR" "/etc/auton-model"
            "AGENT_NUM_CTX" (toString .Values.agent.numCtx)
            "MAX_STEPS" (toString .Values.agent.maxSteps)
            "AGENT_MAX_OBSERVATION_CHARS" (toString .Values.agent.maxObservationChars)
            "AGENT_MAX_HISTORY_CHARS" (toString .Values.agent.maxHistoryChars)
            "AGENT_JOB_TIMEOUT" (toString .Values.agent.jobTimeout)
            "AGENT_SANDBOX" "off"
            "OLLAMA_HOST" .Values.provider.baseUrl
            "AGENT_NAMESPACES" (printf "%s,%s" (include "auton.namespace" .) (include "auton.appsNamespace" .))
            "AGENT_K8S_ENABLED" "1"
            "AGENT_K8S_WRITE" "1"
            "AGENT_QUEUE" .Values.queue.backend
            "AGENT_REDIS_URL" (include "auton.redisUrl" .)
            "AGENT_QUEUE_PREFIX" .Values.queue.prefix
            "AGENT_WORKER_POLL" (toString .Values.ops.poll)
            "AGENT_TASK_LEASE" (toString .Values.queue.lease)
            "AGENT_GPU_LOCK_TTL" (toString .Values.queue.gpuLockTtl)
            "AGENT_OPS_HEARTBEAT" .Values.ops.heartbeat
            "N8N_API_URL" (printf "%s/api/v1" (include "auton.n8nUrl" .))
            "N8N_WEBHOOK_BASE" (printf "%s/webhook" (include "auton.n8nUrl" .))
            "N8N_API_KEY_FILE" "/etc/n8n-api/api-key"
          }}
          {{- range $key, $value := .Values.ops.env }}
          {{- $_ := set $env $key (toString $value) }}
          {{- end }}
          env:
            - name: AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "auton.tokenSecretName" .) .Values.agent.auth.existingSecret }}
                  key: token
            {{- if .Values.queue.redisExistingSecret }}
            - name: AGENT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.queue.redisExistingSecret }}
                  key: password
            {{- end }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.ops.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: model-config
              mountPath: /etc/auton-model/config
              readOnly: true
            - name: model-secret
              mountPath: /etc/auton-model/secret
              readOnly: true
            # optional: the executor starts even before the n8n API key exists.
            - name: n8n-api
              mountPath: /etc/n8n-api
              readOnly: true
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, time
                  path = "{{ .Values.ops.heartbeat }}"
                  sys.exit(0 if os.path.exists(path)
                           and time.time() - os.path.getmtime(path) < 600 else 1)
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "auton.workspaceClaim" . }}
        - name: tmp
          emptyDir: {}
        - name: model-config
          configMap:
            name: auton-model-config
        - name: model-secret
          secret:
            secretName: {{ default (include "auton.modelSecretName" .) .Values.provider.existingSecret }}
            optional: true
        - name: n8n-api
          secret:
            secretName: {{ default .Values.n8n.apiKey.secretName .Values.n8n.apiKey.existingSecret }}
            optional: true
      {{- with .Values.ops.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ops.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ops.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
