{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auton-worker
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
    app: auton-worker
    # Neither the model nor another playbook may repair the workers.
    auton.io/protect: "true"
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate          # RWO volume: never two pods per node during a rollout
  selector:
    matchLabels:
      app: auton-worker
  template:
    metadata:
      labels:
        {{- include "auton.labels" . | nindent 8 }}
        app: auton-worker
        auton.io/protect: "true"
    spec:
      # The only component with write verbs, scoped to the apps namespace.
      serviceAccountName: {{ .Values.serviceAccount.worker.name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-workspace-owner
          image: {{ include "auton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "chown -R 10001:10001 /workspace && chmod 0770 /workspace"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: worker
          image: {{ include "auton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "ops_worker.py"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- $env := dict
            "HOME" "/tmp"
            "TMPDIR" "/tmp"
            "PYTHONDONTWRITEBYTECODE" "1"
            "AGENT_NAMESPACES" (printf "%s,%s" (include "auton.namespace" .) (include "auton.appsNamespace" .))
            "AGENT_OPS_NAMESPACES" (join "," .Values.worker.namespaces)
            "AGENT_K8S_ENABLED" "1"
            "AGENT_K8S_WRITE" "1"
            "AGENT_AUDIT_DIR" "/workspace/.ops"
            "AGENT_INCIDENTS_DIR" "/workspace/.ops/incidents"
            "AGENT_QUEUE" .Values.queue.backend
            "AGENT_REDIS_URL" (include "auton.redisUrl" .)
            "AGENT_QUEUE_PREFIX" .Values.queue.prefix
            "AGENT_TASK_LEASE" (toString .Values.queue.lease)
            "AGENT_TASK_MAX_ATTEMPTS" (toString .Values.queue.maxAttempts)
            "AGENT_TASK_BACKOFF" .Values.queue.backoff
            "AGENT_WORKER_POLL" "5"
            "AGENT_OPS_COOLDOWN" (toString .Values.worker.cooldown)
            "AGENT_OPS_MAX_ACTIONS_PER_HOUR" (toString .Values.worker.maxActionsPerHour)
            "AGENT_OPS_MAX_MEMORY" .Values.worker.maxMemory
            "AGENT_OPS_MAX_INCIDENTS" (toString .Values.worker.maxIncidents)
            "AGENT_OPS_PRUNE_EVERY" (toString .Values.worker.pruneEvery)
            "AGENT_OPS_DRY_RUN" (ternary "1" "0" .Values.worker.dryRun)
            "AGENT_OPS_HEARTBEAT" .Values.worker.heartbeat
            "AGENT_POLICY_DIR" "/etc/auton-policy"
            "AGENT_API_URL" .Values.worker.apiUrl
            "AGENT_UI_URL" .Values.worker.uiUrl
            "N8N_OPS_WEBHOOK" .Values.worker.n8nWebhook
          }}
          {{- range $key, $value := .Values.worker.env }}
          {{- $_ := set $env $key (toString $value) }}
          {{- end }}
          env:
            - name: AGENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "auton.tokenSecretName" .) .Values.agent.auth.existingSecret }}
                  key: token
            {{- if .Values.queue.redisExistingSecret }}
            - name: AGENT_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.queue.redisExistingSecret }}
                  key: password
            {{- end }}
            {{- range $key, $value := $env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            {{- if .Values.policy.create }}
            - name: policy
              mountPath: /etc/auton-policy
              readOnly: true
            {{- end }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import os, sys, time
                  path = "{{ .Values.worker.heartbeat }}"
                  sys.exit(0 if os.path.exists(path)
                           and time.time() - os.path.getmtime(path) < 900 else 1)
            initialDelaySeconds: 60
            periodSeconds: 60
            failureThreshold: 5
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ include "auton.workspaceClaim" . }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.policy.create }}
        - name: policy
          configMap:
            name: {{ .Values.policy.configMapName }}
            optional: true
        {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
