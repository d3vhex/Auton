{{- if .Values.n8n.enabled }}
{{- if and .Values.n8n.apiKey.value (not .Values.n8n.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.n8n.apiKey.secretName }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.n8n.apiKey.value | quote }}
{{- end }}
{{- if and (or .Values.n8n.notify.slackWebhook .Values.n8n.notify.telegramBotToken) (not .Values.n8n.notify.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.n8n.notify.secretName }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.n8n.notify.slackWebhook }}
  slack-webhook: {{ . | quote }}
  {{- end }}
  {{- with .Values.n8n.notify.telegramBotToken }}
  telegram-bot-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.n8n.notify.telegramChatId }}
  telegram-chat-id: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
    app: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC + SQLite: one writer
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        {{- include "auton.labels" . | nindent 8 }}
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000       # n8n runs as uid/gid 1000
      containers:
        - name: n8n
          image: {{ .Values.n8n.image }}
          imagePullPolicy: {{ .Values.n8n.imagePullPolicy }}
          ports:
            - containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_HOST
              value: {{ .Values.n8n.host | quote }}
            - name: WEBHOOK_URL
              value: {{ printf "http://%s/" .Values.n8n.host | quote }}
            - name: N8N_EDITOR_BASE_URL
              value: {{ printf "http://%s/" .Values.n8n.host | quote }}
            # Expressions in generated workflows read $env.
            - name: N8N_BLOCK_ENV_ACCESS_IN_NODE
              value: "false"
            - name: AGENT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "auton.tokenSecretName" .) .Values.agent.auth.existingSecret }}
                  key: token
            {{- range $key, $value := .Values.n8n.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Optional notification targets.
            - name: SLACK_OPS_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.n8n.notify.secretName .Values.n8n.notify.existingSecret }}
                  key: slack-webhook
                  optional: true
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.n8n.notify.secretName .Values.n8n.notify.existingSecret }}
                  key: telegram-bot-token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default .Values.n8n.notify.secretName .Values.n8n.notify.existingSecret }}
                  key: telegram-chat-id
                  optional: true
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-api
              mountPath: /etc/n8n-api
              readOnly: true
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: {{ default "n8n-data" .Values.n8n.persistence.existingClaim }}
        - name: n8n-api
          secret:
            secretName: {{ default .Values.n8n.apiKey.secretName .Values.n8n.apiKey.existingSecret }}
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
    app: n8n
spec:
  type: ClusterIP
  selector:
    app: n8n
  ports:
    - name: http
      port: 5678
      targetPort: 5678
{{- end }}
