{{- if .Values.rbac.create }}
{{- $ns := include "auton.namespace" . }}
{{- $apps := include "auton.appsNamespace" . }}
{{- $agent := .Values.serviceAccount.agent.name }}
{{- $api := .Values.serviceAccount.api.name }}
{{- $scanner := .Values.serviceAccount.scanner.name }}
{{- $worker := .Values.serviceAccount.worker.name }}
# --------------------------------------------------------------------------- #
# Service accounts: one identity per pod role, so a bug in one cannot use the
# permissions of another. RBAC — not the Python code — is the real boundary.
# --------------------------------------------------------------------------- #
{{- if .Values.serviceAccount.agent.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $agent }}
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
{{- if .Values.serviceAccount.api.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $api }}
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# The API's only mutation is writing provider settings for the UI. The agent
# loop runs in auton-ops, so this identity cannot delete a pod.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-api
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
rules:
  # resourceNames is the boundary: no other ConfigMap or Secret is reachable,
  # and `get` is not granted (the agent reads the projected files instead).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["auton-model-config"]
    verbs: ["patch"]
  # The repair policy is the other object the API may write: the UI can
  # tighten or loosen what the workers are allowed to do.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["auton-policy"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["auton-model"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-api
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-api
subjects:
  - kind: ServiceAccount
    name: {{ $api }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.serviceAccount.scanner.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $scanner }}
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Read-only: a bug in the scanner can produce a wrong finding, never a mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-scanner
  namespace: {{ $apps }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-scanner
  namespace: {{ $apps }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-scanner
subjects:
  - kind: ServiceAccount
    name: {{ $scanner }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.serviceAccount.worker.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $worker }}
  namespace: {{ $ns }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Playbook-shaped and nothing else: read for diagnosis, delete pods (stuck /
# CrashLoopBackOff), patch and scale Deployments (OOM bump, rollout undo).
# No create, no configmaps, no exec, no secrets, no PVC verbs at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-worker
  namespace: {{ $apps }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-worker
  namespace: {{ $apps }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-worker
subjects:
  - kind: ServiceAccount
    name: {{ $worker }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.serviceAccount.agent.create }}
# --------------------------------------------------------------------------- #
# The LLM executor: repair rights in both namespaces + the read-only cluster
# view its kubectl tools need. Deliberately absent everywhere: secrets,
# serviceaccounts/roles/rolebindings, namespace delete, PVC delete.
# --------------------------------------------------------------------------- #
{{- range $target := list $ns $apps }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-agent
  namespace: {{ $target }}
  labels:
    {{- include "auton.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - events
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["create", "update", "patch", "delete"]
  # PVCs may be created/updated but never deleted: no "delete" on purpose.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-agent
  namespace: {{ $target }}
  labels:
    {{- include "auton.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-agent
subjects:
  - kind: ServiceAccount
    name: {{ $agent }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.rbac.clusterReader }}
---
# Cluster-scoped and read-only: nodes, PVs, CRDs and storage classes are needed
# for diagnosis, never for mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auton-cluster-reader
  labels:
    {{- include "auton.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status", "nodes/metrics", "namespaces", "persistentvolumes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiregistration.k8s.io"]
    resources: ["apiservices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auton-cluster-reader
  labels:
    {{- include "auton.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auton-cluster-reader
subjects:
  - kind: ServiceAccount
    name: {{ $agent }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}
{{- end }}
