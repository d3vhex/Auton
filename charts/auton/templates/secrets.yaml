{{- if not .Values.agent.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auton.tokenSecretName" . }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
  annotations:
    # A regenerated token would break n8n and the ops controller; keep it on
    # uninstall unless the operator deletes it explicitly.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ include "auton.apiToken" . | quote }}
{{- end }}
{{- if not .Values.provider.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auton.modelSecretName" . }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.provider.apiKey | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auton-model-config
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
data:
  provider: {{ .Values.provider.name | quote }}
  base_url: {{ .Values.provider.baseUrl | quote }}
  model: {{ .Values.provider.model | quote }}
  max_tokens: {{ .Values.provider.maxTokens | quote }}
  data_policy: {{ .Values.provider.dataPolicy | quote }}
