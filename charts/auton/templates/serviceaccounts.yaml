{{- if .Values.rbac.create }}
{{- if .Values.serviceAccount.agent.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.agent.name }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
{{- if and .Values.ops.enabled .Values.serviceAccount.ops.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.ops.name }}
  namespace: {{ include "auton.namespace" . }}
  labels:
    {{- include "auton.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
{{- end }}
