# Default values for the Auton chart.
#
# The chart mirrors yamls/ in the repository, but is meant to be installable
# from Docker Hub images without a local build:
#
#   helm install auton oci://registry-1.docker.io/d3vhex/charts/auton \
#     --namespace auton --create-namespace \
#     --set agent.auth.token="$(openssl rand -hex 24)"
#
# The system has five pod roles, each with its own identity:
#
#   auton          the HTTP API + UI          (auton-api)     producer only
#   auton-scanner  read-only detection ×2     (auton-scanner) fills the queue
#   auton-worker   repair playbooks ×2        (auton-worker)  the only writer
#   auton-ops      LLM executor ×1            (auton-agent)   runs agent tasks
#   redis          shared queue ×1            (no SA)         state, locks, budget
#
# Everything the agent needs to be safe (RBAC, audit PVC, namespace split) is
# created by the chart. Ollama and n8n are optional so the chart also works on
# a cluster that already has them.

# Fixed resource names are intentional: the agent's own docs, the generated n8n
# workflow and the workers all address "auton:8080" by DNS.
nameOverride: ""

namespace:
  # Create the application namespace. Set to false when installing with
  # --create-namespace or into an existing namespace.
  create: true
  name: auton

appsNamespace:
  # Namespace the operation agent may repair without being asked. Keep it
  # separate from the control plane namespace so a bad repair cannot take the
  # API down.
  create: true
  name: auton-apps

image:
  repository: docker.io/d3vhex/auton
  # Defaults to Chart.appVersion when empty.
  tag: ""
  # IfNotPresent is right for a pinned tag; use Always with a moving tag.
  pullPolicy: IfNotPresent
imagePullSecrets: []

# --------------------------------------------------------------------------- #
# The API pod: validation, UI, /run producer, /tasks and /audit reads.
# --------------------------------------------------------------------------- #
agent:
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
  auth:
    # Either point at a Secret you manage (it must have key `token`) or let the
    # chart generate/keep one. A generated token is stable across upgrades.
    existingSecret: ""
    secretName: auton-api-token
    token: ""
  workspace:
    # Use a claim you already have (e.g. a RWX volume on a multi-node cluster).
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
    # Keep the PVC on `helm uninstall`: it holds the audit log, incidents and
    # the agent's workspace.
    keep: true
  # Agent loop tuning (see mcp/README.md). Used by the ops executor.
  model: qwen2.5-coder:7b-instruct
  numCtx: 16384
  maxSteps: 25
  maxObservationChars: 8000
  maxHistoryChars: 60000
  maxQueue: 8
  jobTimeout: 900
  # Extra env vars for the API pod, e.g. AGENT_AUTH_DISABLED: "1" (never in a
  # shared cluster).
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------- #
# Queue backend shared by every pod. `redis` is the cluster default; there is
# no memory fallback — with `redis` and an unreachable server the API refuses to
# start instead of silently losing repair tasks to a private in-memory queue.
# --------------------------------------------------------------------------- #
queue:
  backend: redis           # redis | memory (memory is for local/test only)
  prefix: auton
  # Empty derives redis://redis.<namespace>.svc.cluster.local:6379/0
  redisUrl: ""
  # Optional auth; prefer an existing Secret with key `password`.
  redisPassword: ""
  redisExistingSecret: ""
  redisSecretName: auton-redis
  # Global LLM slot: one model call at a time even if ops is scaled by accident.
  gpuLockTtl: 900
  lease: 300               # a crashed worker's task is requeued after this
  maxAttempts: 3
  backoff: "30,120,300"
  maxTaskQueue: 500

redis:
  enabled: true
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  # noeviction is deliberate: a full Redis refuses the write and the worker
  # fails closed instead of dropping a repair.
  maxMemory: 256mb
  appendFsync: everysec
  persistence:
    existingClaim: ""
    storageClass: ""
    size: 1Gi
    keep: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 320Mi

# --------------------------------------------------------------------------- #
# Scanner: read-only detection. Replicas > 1 is safe by design; the dedupe
# window collapses concurrent submissions of the same finding into one task.
# --------------------------------------------------------------------------- #
scanner:
  enabled: true
  replicas: 2
  interval: 60
  dedupeWindow: 300
  cooldown: 1800
  startupGrace: 120
  terminationGrace: 120
  heartbeat: /tmp/scanner-heartbeat
  # Namespaces it watches; must be covered by its read-only Role.
  namespaces:
    - auton-apps
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------- #
# Repair worker: executes the playbooks. The only component with write verbs.
# Two workers repair different Deployments in parallel; the per-resource lock
# serialises the same one.
# --------------------------------------------------------------------------- #
worker:
  enabled: true
  replicas: 2
  cooldown: 1800
  maxActionsPerHour: 6
  maxMemory: 2Gi
  maxIncidents: 500
  pruneEvery: 300
  dryRun: false
  heartbeat: /tmp/worker-heartbeat
  # Namespaces a playbook may repair. RBAC is created for appsNamespace only;
  # add namespaces here together with your own Role if you extend it.
  namespaces:
    - auton-apps
  apiUrl: http://auton:8080
  uiUrl: http://auton.localhost
  # n8n webhook that fans reports out to Slack/Telegram. Empty disables it.
  n8nWebhook: ""
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --------------------------------------------------------------------------- #
# Ops executor: the single pod that runs LLM agent tasks from the queue.
# One replica; a second is safe (it defers while the GPU slot is held) but a
# single GPU cannot run two agent loops faster.
# --------------------------------------------------------------------------- #
ops:
  enabled: true
  replicas: 1
  poll: 5
  heartbeat: /tmp/agent-heartbeat
  env: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

provider:
  name: ollama            # ollama | openai | gemini | anthropic | custom
  baseUrl: http://ollama-service:11434
  model: qwen2.5-coder:7b-instruct
  maxTokens: 1024
  dataPolicy: redact      # redact | allow | local-only
  # Create Secret auton-model from apiKey, or reuse an existing Secret with
  # key `api-key`. An empty key is valid for ollama.
  existingSecret: ""
  secretName: auton-model
  apiKey: ""

ollama:
  enabled: false
  image: ollama/ollama:latest
  imagePullPolicy: IfNotPresent
  model: qwen2.5-coder:7b-instruct
  # Pull the model into the PVC after install/upgrade. This is idempotent.
  pullModel: true
  gpu:
    enabled: true
    resourceName: amd.com/gpu
    count: 1
  env:
    HSA_OVERRIDE_GFX_VERSION: "10.3.0"
    OLLAMA_KEEP_ALIVE: 30m
    OLLAMA_FLASH_ATTENTION: "1"
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_NUM_PARALLEL: "1"
  persistence:
    existingClaim: ""
    storageClass: ""
    size: 20Gi
    keep: true
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      memory: 12Gi

n8n:
  enabled: false
  image: docker.n8n.io/n8nio/n8n:latest
  imagePullPolicy: IfNotPresent
  persistence:
    existingClaim: ""
    storageClass: ""
    size: 5Gi
    keep: true
  # Public-API key used by the agent's n8n tools. Create it in the n8n UI and
  # either set it here or point at a Secret you manage; the mount is optional,
  # so an absent key only makes the n8n tools return a clear error.
  apiKey:
    existingSecret: ""
    secretName: n8n-api
    value: ""
  notify:
    # Optional ops notification targets (n8n environment variables). Leave
    # empty to skip the Secret; the generated workflow then logs an error.
    existingSecret: ""
    secretName: n8n-notify
    slackWebhook: ""
    telegramBotToken: ""
    telegramChatId: ""
  host: n8n.localhost
  env:
    GENERIC_TIMEZONE: Europe/Istanbul
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: auton.localhost
      service: auton
      port: 8080
    - host: agent.localhost
      service: auton
      port: 8080
  tls: []

rbac:
  create: true
  # Cluster-scoped read-only access for diagnosis (nodes, PVs, CRDs, ...).
  clusterReader: true

serviceAccount:
  # The HTTP API: may only PATCH the provider ConfigMap and Secret.
  api:
    create: true
    name: auton-api
  # Read-only detection in the apps namespace.
  scanner:
    create: true
    name: auton-scanner
  # The playbooks: pod delete + Deployment patch/scale in the apps namespace.
  worker:
    create: true
    name: auton-worker
  # The LLM executor: repair rights in both namespaces + cluster read-only.
  agent:
    create: true
    name: auton-agent

# Namespace labels applied to both created namespaces (the standard
# app.kubernetes.io/* labels are added by the helpers).
namespaceLabels: {}
