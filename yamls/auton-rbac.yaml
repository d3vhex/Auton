# RBAC for the Auton agent, the API, the scanners and the repair workers.
#
# Every pod runs kubectl inside its own pod with the token of its
# ServiceAccount. RBAC — not the Python code — is the real security boundary.
# There are four identities:
#
#   auton-api      the HTTP API: may only PATCH the provider ConfigMap/Secret
#   auton-scanner  read-only detection in `auton-apps`; never mutates
#   auton-worker   repair rights in `auton-apps` only (the playbooks)
#   auton-agent    the LLM executor: repair rights in `auton` + `auton-apps`
#
# Namespace scope (auton + auton-apps): the agent may repair workloads, which
# is what "autonomous operations" needs. Deliberately NOT granted anywhere:
#   - general secrets access  (one exception: the API identity may PATCH the
#                              single Secret `auton-model` to store a provider
#                              API key; never get/list another Secret)
#   - persistentvolumeclaims delete   (data loss is irreversible; the agent must
#                            report and ask a human, and RBAC enforces it even
#                            if the tool guard is bypassed)
#   - serviceaccounts / roles / rolebindings   (no privilege escalation)
#   - namespaces delete
#
# Cluster scope is read-only (auton-cluster-reader) and only the LLM executor
# needs it; scanners/workers read just their namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auton-agent
  namespace: auton
automountServiceAccountToken: true
---
# The HTTP API's own identity. It is deliberately almost powerless: the only
# mutation it performs is writing model-provider settings for the UI. Workload
# repair runs in the worker pods with their own ServiceAccount, so a bug in the
# UI/HTTP layer cannot delete a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auton-api
  namespace: auton
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-api
  namespace: auton
rules:
# Provider settings only. resourceNames is the boundary: no other ConfigMap or
# Secret is reachable, and `get` is not granted (the agent reads the projected
# files, not the API objects).
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["auton-model-config"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["auton-model"]
  verbs: ["patch"]
# The repair policy (`auton-policy`) is the other object the API may write:
# the UI can tighten or loosen what the workers are allowed to do. It is one
# named ConfigMap, and nothing else is reachable.
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["auton-policy"]
  verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-api
  namespace: auton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-api
subjects:
- kind: ServiceAccount
  name: auton-api
  namespace: auton
---
# The scanner is read-only: a bug there can only produce a wrong finding, never
# a mutation. It repairs nothing, so it needs no write verbs anywhere.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auton-scanner
  namespace: auton
automountServiceAccountToken: true
---
# The repair worker owns every playbook mutation. Its Role (below) is limited
# to `auton-apps`, so even a compromised worker cannot touch the API, Redis or
# its own Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auton-worker
  namespace: auton
automountServiceAccountToken: true
---
# --------------------------------------------------------------------------- #
# Namespace role, applied to both target namespaces
# --------------------------------------------------------------------------- #
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-agent
  namespace: auton
rules:
# --- read (diagnosis) ------------------------------------------------------ #
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/status
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  - resourcequotas
  - limitranges
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
# --- repair (workloads) ---------------------------------------------------- #
# PVCs may be created/updated but NOT deleted: no "delete" verb on purpose.
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "update", "patch", "delete"]
# Ingress may be created by the installer (P4); delete stays a human decision.
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["create", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-agent
  namespace: auton-apps
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/status
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  - resourcequotas
  - limitranges
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["create", "update", "patch"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments/scale", "statefulsets/scale"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["create", "update", "patch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["create", "update", "patch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-agent
  namespace: auton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-agent
subjects:
- kind: ServiceAccount
  name: auton-agent
  namespace: auton
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-agent
  namespace: auton-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-agent
subjects:
- kind: ServiceAccount
  name: auton-agent
  namespace: auton
---
# --------------------------------------------------------------------------- #
# Cluster-scoped, read-only (diagnosis only)
# --------------------------------------------------------------------------- #
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auton-cluster-reader
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/status
  - nodes/metrics
  - namespaces
  - persistentvolumes
  - events
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources:
  - storageclasses
  - csidrivers
  - csinodes
  - volumeattachments
  verbs: ["get", "list", "watch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apiregistration.k8s.io"]
  resources: ["apiservices"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingressclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["scheduling.k8s.io"]
  resources: ["priorityclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: auton-cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auton-cluster-reader
subjects:
- kind: ServiceAccount
  name: auton-agent
  namespace: auton
# --------------------------------------------------------------------------- #
# Scanner identity: read-only, `auton-apps` only.
# --------------------------------------------------------------------------- #
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-scanner
  namespace: auton-apps
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/status
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  - resourcequotas
  - limitranges
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-scanner
  namespace: auton-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-scanner
subjects:
- kind: ServiceAccount
  name: auton-scanner
  namespace: auton
# --------------------------------------------------------------------------- #
# Worker identity: the playbooks, and nothing else.
#
# Read everything it diagnoses, delete pods (stuck/CrashLoop) and patch/scale
# Deployments (OOM bump, rollout undo). No create, no configmaps, no exec,
# no secrets, no PVC verbs at all.
# --------------------------------------------------------------------------- #
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auton-worker
  namespace: auton-apps
rules:
- apiGroups: [""]
  resources:
  - pods
  - pods/log
  - pods/status
  - services
  - endpoints
  - configmaps
  - persistentvolumeclaims
  - events
  - resourcequotas
  - limitranges
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses", "networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
# Repairs: restart a pod, raise memory, undo a rollout, restore replicas.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auton-worker
  namespace: auton-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auton-worker
subjects:
- kind: ServiceAccount
  name: auton-worker
  namespace: auton
