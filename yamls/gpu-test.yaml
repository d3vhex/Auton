apiVersion: v1
kind: Pod
metadata:
  name: rocm-test-pod
  namespace: auton
spec:
  restartPolicy: Never
  containers:
  - name: rocm-test-container
    image: rocm/rocm-terminal:latest
    command: ["rocminfo"]
    env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "10.3.0"
    resources:
      limits:
        amd.com/gpu: 1
